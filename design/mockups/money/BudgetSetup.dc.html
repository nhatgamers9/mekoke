<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Set up your budget</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 24px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: flex">
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="Close"></x-import>
</div>
<h1 class="display" style="margin: 0">How do you want to budget?</h1>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend class="label" style="padding: 0; margin-bottom: 10px; color: var(--ink-muted)">Pick a method. You can switch later.</legend>
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 16px; border: 2px solid var(--amber); border-radius: 22px; background: var(--surface); cursor: pointer">
<input type="radio" name="method" checked style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--amber)">
<span style="display: flex; flex-direction: column; gap: 2px">
<span class="headline">50/30/20</span>
<span class="label" style="color: var(--ink-muted)">Needs, wants and savings. Easy to start.</span>
</span>
</label>
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 16px; border: 2px solid var(--line-strong); border-radius: 22px; background: var(--surface); cursor: pointer">
<input type="radio" name="method" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--amber)">
<span style="display: flex; flex-direction: column; gap: 2px">
<span class="headline">Envelopes</span>
<span class="label" style="color: var(--ink-muted)">Give every dollar a job, category by category.</span>
</span>
</label>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="label" for="income">Monthly take-home pay</label>
<input id="income" type="text" inputmode="decimal" value="$4,000" class="body-strong" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 2px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--ink)">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 class="overline" style="margin: 0; color: var(--ink-muted)">YOUR SPLIT</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 22px; background: var(--surface)">
<span class="caption" style="color: var(--ink-muted)">Needs · 50%</span>
<span style="font-size: 20px; line-height: 24px; font-weight: 700">$2,000</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 22px; background: var(--surface)">
<span class="caption" style="color: var(--ink-muted)">Wants · 30%</span>
<span style="font-size: 20px; line-height: 24px; font-weight: 700">$1,200</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 22px; background: var(--surface)">
<span class="caption" style="color: var(--ink-muted)">Savings · 20%</span>
<span style="font-size: 20px; line-height: 24px; font-weight: 700">$800</span>
</div>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: flex-start; gap: 8px; color: var(--ink-muted)">
<x-import component-from-global-scope="Steady.Icon" name="lock" size="{{iconSize}}"></x-import>
<p class="caption" style="margin: 0">Stays on this phone. No bank connection, no account needed.</p>
</div>
<x-import component-from-global-scope="Steady.Button" variant="primary" block="{{yes}}">Create budget</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, iconSize: 16 };
}
}
</script>
</body>
</html>
