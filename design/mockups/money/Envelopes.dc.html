<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Budgets, envelopes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 24px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px">
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="Close"></x-import>
<h1 class="title" style="margin: 0">Budgets</h1>
</div>
<x-import component-from-global-scope="Steady.SegmentedControl" label="Budget method" value="envelopes" options="{{methods}}"></x-import>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column">
<span class="label" style="color: var(--ink-muted)">October · $4,000 income</span>
<span class="body-strong">Every dollar has a job</span>
</div>
<x-import component-from-global-scope="Steady.Chip" tone="tide" icon="check">All assigned</x-import>
</div>
<div style="flex-grow: 1; border-radius: 22px; overflow: hidden">
<x-import component-from-global-scope="Steady.BudgetRow" icon="house" name="Rent" spent="$1,200" limit="$1,200" left="Paid" value="{{full}}"></x-import>
<x-import component-from-global-scope="Steady.BudgetRow" icon="shopping-cart" name="Groceries" spent="$320" limit="$450" left="$130 left" value="{{groceries}}"></x-import>
<x-import component-from-global-scope="Steady.BudgetRow" icon="zap" name="Bills" spent="$210" limit="$270" left="$60 left" value="{{bills}}"></x-import>
<x-import component-from-global-scope="Steady.BudgetRow" icon="coffee" name="Eating out" spent="$184" limit="$160" left="Over by $24" value="{{full}}" over="{{yes}}"></x-import>
<x-import component-from-global-scope="Steady.BudgetRow" icon="music" name="Fun" spent="$90" limit="$240" left="$150 left" value="{{fun}}"></x-import>
</div>
<x-import component-from-global-scope="Steady.Button" variant="secondary" block="{{yes}}" icon="plus">Add envelope</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
full: 1,
groceries: 0.71,
bills: 0.78,
fun: 0.375,
methods: [{ value: 'envelopes', label: 'Envelopes' }, { value: 'rule', label: '50/30/20' }]
};
}
}
</script>
</body>
</html>
