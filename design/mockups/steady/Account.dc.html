<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 12px 20px 28px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px">
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="Close"></x-import>
<h1 class="title" style="margin: 0">Account</h1>
</div>
<div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 22px; background: var(--surface)">
<div aria-hidden="true" style="display: grid; place-items: center; width: 56px; height: 56px; border-radius: 9999px; background: var(--amber-soft); color: var(--amber); font-family: var(--font-serif); font-size: 26px; line-height: 30px; font-weight: 500">A</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span class="headline">Alex Morgan</span>
<span class="label" style="color: var(--ink-muted)">alex@gmail.com</span>
<x-import component-from-global-scope="Steady.Chip">Signed in with Google</x-import>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="overline" style="color: var(--ink-muted)">BACKUP</span>
<div style="border-radius: 22px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line)">
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span class="body">Back up automatically</span>
<span class="label" style="color: var(--ink-muted)">Last backup today, 9:41 PM</span>
</div>
<x-import component-from-global-scope="Steady.Switch" label="Back up automatically" checked="{{yes}}"></x-import>
</div>
<x-import component-from-global-scope="Steady.ListRow" icon="rotate-ccw" title="Restore from backup" detail="Replaces data on this phone" trailing="chevron"></x-import>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<x-import component-from-global-scope="Steady.Button" variant="secondary" block="{{yes}}">Sign out</x-import>
<x-import component-from-global-scope="Steady.Button" variant="danger" block="{{yes}}">Delete account and backup</x-import>
<p class="caption" style="margin: 0; color: var(--ink-muted); text-align: center">Deleting removes your backup. Data on this phone stays.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
