<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Free trial</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#aaa298}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 24px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<div role="img" aria-label="Step 3 of 3" style="display: flex; gap: 6px">
<span style="width: 24px; height: 4px; border-radius: 9999px; background: var(--amber)"></span>
<span style="width: 24px; height: 4px; border-radius: 9999px; background: var(--amber)"></span>
<span style="width: 24px; height: 4px; border-radius: 9999px; background: var(--amber)"></span>
</div>
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="Close"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="overline" style="color: var(--amber)">STEADY PREMIUM</span>
<h1 class="display" style="margin: 0">Try everything free for 3 days</h1>
</div>
<ol aria-label="How your free trial works" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<li style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center">
<span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9999px; background: var(--amber-soft); color: var(--amber)"><x-import component-from-global-scope="Steady.Icon" name="lock-open" size="{{iconSize}}"></x-import></span>
<span style="width: 2px; flex-grow: 1; min-height: 12px; background: var(--line-strong)"></span>
</div>
<div style="display: flex; flex-direction: column; padding: 8px 0 14px">
<span class="headline">Today</span>
<span class="label" style="color: var(--ink-muted)">Every sound, mixing and custom plans.</span>
</div>
</li>
<li style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center">
<span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9999px; background: var(--surface-2); color: var(--ink)"><x-import component-from-global-scope="Steady.Icon" name="bell" size="{{iconSize}}"></x-import></span>
<span style="width: 2px; flex-grow: 1; min-height: 12px; background: var(--line-strong)"></span>
</div>
<div style="display: flex; flex-direction: column; padding: 8px 0 14px">
<span class="headline">Day 2</span>
<span class="label" style="color: var(--ink-muted)">We’ll remind you before it ends.</span>
</div>
</li>
<li style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center">
<span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9999px; background: var(--surface-2); color: var(--ink)"><x-import component-from-global-scope="Steady.Icon" name="calendar-check" size="{{iconSize}}"></x-import></span>
</div>
<div style="display: flex; flex-direction: column; padding: 8px 0 0">
<span class="headline">Day 3</span>
<span class="label" style="color: var(--ink-muted)">Your plan starts. Cancel anytime before.</span>
</div>
</li>
</ol>
<div style="flex-grow: 1"></div>
<div role="radiogroup" aria-label="Choose a plan" style="display: flex; flex-direction: column; gap: 12px">
<x-import component-from-global-scope="Steady.PlanOption" title="Monthly" price="[PRICE]" period="per month" note="3 days free" selected="{{yes}}"></x-import>
<x-import component-from-global-scope="Steady.PlanOption" title="Weekly" price="[PRICE]" period="per week" note="3 days free"></x-import>
</div>
<x-import component-from-global-scope="Steady.Button" variant="primary" block="{{yes}}">Start my free trial</x-import>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<p class="caption" style="margin: 0; color: var(--ink-muted)">Free for 3 days, then [PRICE] per month. Cancel in Google Play.</p>
<p class="caption" style="margin: 0; display: flex; gap: 16px"><a href="#">Restore</a><a href="#">Terms</a><a href="#">Privacy</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, iconSize: 20 };
}
}
</script>
</body>
</html>
