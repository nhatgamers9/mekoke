<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Home screen widgets</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 420px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px; background: var(--surface-2); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="box-sizing: border-box; height: 148px; padding: 16px; border-radius: 22px; background: var(--bg); display: flex; flex-direction: column; justify-content: space-between">
<span class="overline" style="color: var(--amber)">NO SMOKING</span>
<div style="display: flex; align-items: baseline; gap: 6px">
<span style="font-family: var(--font-serif); font-size: 56px; line-height: 56px; font-weight: 500; letter-spacing: -0.03em">127</span>
<span class="label" style="color: var(--ink-muted)">days</span>
</div>
</div>
<span class="caption" style="color: var(--ink-muted)">Streak · 2×2</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="box-sizing: border-box; height: 148px; padding: 16px; border-radius: 22px; background: var(--bg); display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; flex-direction: column">
<span class="overline" style="color: var(--amber)">FOCUS</span>
<span class="title">Brown noise</span>
</div>
<x-import component-from-global-scope="Steady.IconButton" variant="filled" icon="play" label="Play brown noise"></x-import>
</div>
<span class="caption" style="color: var(--ink-muted)">Focus · 2×2</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="box-sizing: border-box; height: 148px; padding: 16px; border-radius: 22px; background: var(--bg); display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span class="overline" style="color: var(--amber)">FASTING · 16:8</span>
<span class="label" style="color: var(--ink-muted)">Ends 12:00 PM</span>
</div>
<span style="font-family: var(--font-serif); font-size: 44px; line-height: 48px; font-weight: 500; letter-spacing: -0.02em">9:58:12</span>
<x-import component-from-global-scope="Steady.ProgressBar" value="{{progress}}" label="Fasting progress"></x-import>
</div>
<span class="caption" style="color: var(--ink-muted)">Fasting · 4×2</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return { progress: 0.62 };
}
}
</script>
</body>
</html>
