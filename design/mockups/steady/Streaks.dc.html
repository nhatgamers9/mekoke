<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Streaks</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 32px 20px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 4px">
<h1 class="display" style="margin: 0">Streaks</h1>
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="settings" label="Settings"></x-import>
</div>
<x-import component-from-global-scope="Steady.StreakCard" habit="No smoking" days="{{smoking}}" since="Since May 28" milestone="{{milestone}}"></x-import>
<x-import component-from-global-scope="Steady.StreakCard" size="sm" habit="Less social media" days="{{social}}" since="Since Sep 9"></x-import>
<x-import component-from-global-scope="Steady.StreakCard" size="sm" habit="No sugar" days="{{sugar}}" since="Since Sep 23"></x-import>
<x-import component-from-global-scope="Steady.Button" variant="secondary" block="{{yes}}" icon="plus">Add habit</x-import>
</div>
<x-import component-from-global-scope="Steady.TabBar" items="{{tabs}}" active="{{tab}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
smoking: 127,
social: 23,
sugar: 9,
milestone: { label: 'Next: 180 days · 53 to go', progress: 0.41 },
tab: 2,
tabs: [
{ icon: 'audio-waveform', label: 'Focus' },
{ icon: 'timer', label: 'Timer' },
{ icon: 'sprout', label: 'Streaks' },
{ icon: 'notebook-pen', label: 'Check-in' }
]
};
}
}
</script>
</body>
</html>
