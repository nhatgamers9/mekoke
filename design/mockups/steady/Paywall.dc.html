<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Premium</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#aaa298}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 12px 20px 24px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: flex; justify-content: flex-end">
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="Close"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="overline" style="color: var(--amber)">STEADY PREMIUM</span>
<h1 class="display" style="margin: 0">Every sound, every plan, no ads</h1>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
<li class="body" style="display: flex; align-items: center; gap: 12px"><span style="color: var(--tide)"><x-import component-from-global-scope="Steady.Icon" name="check" size="{{iconSize}}"></x-import></span>Every sound, offline</li>
<li class="body" style="display: flex; align-items: center; gap: 12px"><span style="color: var(--tide)"><x-import component-from-global-scope="Steady.Icon" name="check" size="{{iconSize}}"></x-import></span>Unlimited habit streaks</li>
<li class="body" style="display: flex; align-items: center; gap: 12px"><span style="color: var(--tide)"><x-import component-from-global-scope="Steady.Icon" name="check" size="{{iconSize}}"></x-import></span>Custom fasting and interval plans</li>
<li class="body" style="display: flex; align-items: center; gap: 12px"><span style="color: var(--tide)"><x-import component-from-global-scope="Steady.Icon" name="check" size="{{iconSize}}"></x-import></span>Full history and widget themes</li>
</ul>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px" role="radiogroup" aria-label="Choose a plan">
<x-import component-from-global-scope="Steady.PlanOption" title="Monthly" price="[PRICE]" period="per month" note="3-day free trial" selected="{{yes}}"></x-import>
<x-import component-from-global-scope="Steady.PlanOption" title="Weekly" price="[PRICE]" period="per week" note="3-day free trial"></x-import>
</div>
<x-import component-from-global-scope="Steady.Button" variant="primary" block="{{yes}}">Try 3 days free</x-import>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<p class="caption" style="margin: 0; color: var(--ink-muted)">Free for 3 days, then [PRICE] per month. Cancel anytime in Google Play.</p>
<p class="caption" style="margin: 0; display: flex; gap: 16px"><a href="#">Restore purchase</a><a href="#">Terms</a><a href="#">Privacy</a></p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, iconSize: 20 };
}
}
</script>
</body>
</html>
