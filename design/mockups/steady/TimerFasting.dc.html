<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Fasting timer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 32px 20px 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 class="display" style="margin: 0">Timer</h1>
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="settings" label="Settings"></x-import>
</div>
<x-import component-from-global-scope="Steady.SegmentedControl" label="Timer type" value="fasting" options="{{modes}}"></x-import>
<div style="display: flex; align-items: center; gap: 8px">
<x-import component-from-global-scope="Steady.Chip">16:8</x-import>
<span class="label" style="color: var(--ink-muted)">Started yesterday, 8:00 PM</span>
</div>
<div style="display: flex; justify-content: center">
<x-import component-from-global-scope="Steady.TimerRing" progress="{{progress}}" time="9:58:12" phase="FASTING" caption="Ends 12:00 PM"></x-import>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 22px; background: var(--surface)">
<span class="stat" style="font-variant-numeric: tabular-nums">6h 01m</span>
<span class="caption" style="color: var(--ink-muted)">Left in this fast</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 22px; background: var(--surface)">
<span class="stat" style="font-variant-numeric: tabular-nums">4 days</span>
<span class="caption" style="color: var(--ink-muted)">Fasting streak</span>
</div>
</div>
<x-import component-from-global-scope="Steady.Button" variant="secondary" block="{{yes}}">End fast</x-import>
<p class="caption" style="margin: 0; color: var(--ink-muted); text-align: center">Fasting isn't right for everyone. Check with your doctor first.</p>
</div>
<x-import component-from-global-scope="Steady.TabBar" items="{{tabs}}" active="{{tab}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
progress: 0.62,
modes: [{ value: 'fasting', label: 'Fasting' }, { value: 'interval', label: 'Interval' }],
tab: 1,
tabs: [
{ icon: 'audio-waveform', label: 'Focus' },
{ icon: 'timer', label: 'Timer' },
{ icon: 'sprout', label: 'Streaks' },
{ icon: 'notebook-pen', label: 'Check-in' }
]
};
}
}
</script>
</body>
</html>
