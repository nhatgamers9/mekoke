<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Focus</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 40px 20px 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="display" style="margin: 0">Focus</h1>
<p class="label" style="margin: 0; color: var(--ink-muted)">Sounds to help you focus and fall asleep</p>
</div>
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="settings" label="Settings"></x-import>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<x-import component-from-global-scope="Steady.SoundTile" icon="waves" name="Brown noise" detail="Deep, steady" active="{{yes}}"></x-import>
<x-import component-from-global-scope="Steady.SoundTile" icon="cloud-rain" name="Rain" detail="Soft, on a roof"></x-import>
<x-import component-from-global-scope="Steady.SoundTile" icon="wind" name="White noise" detail="Bright, even"></x-import>
<x-import component-from-global-scope="Steady.SoundTile" icon="leaf" name="Pink noise" detail="Balanced" locked="{{yes}}"></x-import>
</div>
<div style="border-radius: 22px; overflow: hidden">
<x-import component-from-global-scope="Steady.ListRow" icon="moon" title="Sleep timer" detail="Fade out, then stop" trailing="45 min"></x-import>
<x-import component-from-global-scope="Steady.ListRow" icon="volume-2" title="Volume" trailing="70%"></x-import>
</div>
</div>
<div style="display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--line)">
<div style="flex-grow: 1; display: flex; flex-direction: column">
<span class="overline" style="color: var(--amber)">PLAYING</span>
<span class="title">Brown noise</span>
<span class="label" style="color: var(--ink-muted)">Stops at 11:45 PM</span>
</div>
<x-import component-from-global-scope="Steady.IconButton" variant="play" icon="pause" label="Pause"></x-import>
</div>
<x-import component-from-global-scope="Steady.TabBar" items="{{tabs}}" active="{{tab}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
tab: 0,
tabs: [
{ icon: 'audio-waveform', label: 'Focus' },
{ icon: 'timer', label: 'Timer' },
{ icon: 'sprout', label: 'Streaks' },
{ icon: 'notebook-pen', label: 'Check-in' }
]
};
}
}
</script>
</body>
</html>
