<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Your mix</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 360px; height: 800px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans)">
<dc-import name="FocusLibrary" hint-size="360px,800px"></dc-import>
<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, 0.62)"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; background: var(--surface); border-radius: 30px 30px 0 0; box-shadow: var(--shadow-sheet)">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: var(--line-strong)"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 class="title" style="margin: 0">Your mix</h2>
<x-import component-from-global-scope="Steady.Chip">2 sounds</x-import>
</div>
<div style="border: 1px solid var(--line); border-radius: 22px; overflow: hidden">
<x-import component-from-global-scope="Steady.Slider" icon="cloud-rain" title="Heavy rain" value="{{rain}}"></x-import>
<x-import component-from-global-scope="Steady.Slider" icon="waves" title="Brown noise" value="{{brown}}"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 class="label" style="margin: 0; color: var(--ink-muted)">Sleep timer</h3>
<x-import component-from-global-scope="Steady.FilterChips" label="Sleep timer" value="45" options="{{timers}}"></x-import>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 4px">
<x-import component-from-global-scope="Steady.Button" variant="secondary" icon="plus">Save mix</x-import>
<x-import component-from-global-scope="Steady.Button" variant="primary">Done</x-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
rain: 0.6,
brown: 0.8,
timers: [
{ value: 'off', label: 'Off' }, { value: '15', label: '15 min' }, { value: '30', label: '30 min' },
{ value: '45', label: '45 min' }, { value: '60', label: '60 min' }, { value: 'custom', label: 'Custom' }
]
};
}
}
</script>
</body>
</html>
