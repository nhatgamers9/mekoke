<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Check your inbox</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 28px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: flex; justify-content: flex-start">
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="Close"></x-import>
</div>
<div style="flex-grow: 1"></div>
<div style="display: grid; place-items: center; width: 72px; height: 72px; border-radius: 9999px; background: var(--tide-soft); color: var(--tide)">
<x-import component-from-global-scope="Steady.Icon" name="check" size="{{iconSize}}"></x-import>
</div>
<h1 class="display" style="margin: 0">Check your inbox</h1>
<p class="body" style="margin: 0; color: var(--ink-muted)">We sent a sign-in link to <span style="color: var(--ink); font-weight: 600">alex@gmail.com</span>. Open it on this phone to finish.</p>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<x-import component-from-global-scope="Steady.Button" variant="primary" block="{{yes}}">Open email app</x-import>
<x-import component-from-global-scope="Steady.Button" variant="secondary" block="{{yes}}" disabled="{{yes}}">Resend link in 0:42</x-import>
<a href="SignInEmail.dc.html" class="body-strong" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 9999px; color: var(--amber); text-decoration: none">Use a different email</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, iconSize: 32 };
}
}
</script>
</body>
</html>
