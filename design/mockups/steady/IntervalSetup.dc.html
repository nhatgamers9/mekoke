<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Interval setup</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 32px 20px 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 class="display" style="margin: 0">Timer</h1>
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="settings" label="Settings"></x-import>
</div>
<x-import component-from-global-scope="Steady.SegmentedControl" label="Timer type" value="interval" options="{{modes}}"></x-import>
<x-import component-from-global-scope="Steady.FilterChips" label="Saved workouts" value="tabata" options="{{presets}}"></x-import>
<div style="display: flex; align-items: baseline; gap: 10px">
<span class="stat" style="font-variant-numeric: tabular-nums">4:00</span>
<span class="label" style="color: var(--ink-muted)">16 intervals · 8 rounds</span>
</div>
<div style="border-radius: 22px; overflow: hidden">
<x-import component-from-global-scope="Steady.Stepper" icon="hourglass" label="Prepare" value="0:10"></x-import>
<x-import component-from-global-scope="Steady.Stepper" icon="dumbbell" label="Work" value="0:20"></x-import>
<x-import component-from-global-scope="Steady.Stepper" icon="pause" label="Rest" value="0:10"></x-import>
<x-import component-from-global-scope="Steady.Stepper" icon="repeat" label="Rounds" detail="Work + rest" value="8"></x-import>
<x-import component-from-global-scope="Steady.ListRow" icon="layers" title="Sets" detail="1 set · no rest between" trailing="chevron"></x-import>
</div>
<div style="flex-grow: 1"></div>
<x-import component-from-global-scope="Steady.Button" variant="primary" block="{{yes}}" icon="play">Start workout</x-import>
</div>
<x-import component-from-global-scope="Steady.TabBar" items="{{tabs}}" active="{{tab}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
modes: [{ value: 'fasting', label: 'Fasting' }, { value: 'interval', label: 'Interval' }],
presets: [{ value: 'tabata', label: 'Tabata' }, { value: 'hiit', label: 'HIIT 30/30' }, { value: 'custom', label: 'Custom' }],
tab: 1,
tabs: [
{ icon: 'audio-waveform', label: 'Focus' },
{ icon: 'timer', label: 'Timer' },
{ icon: 'sprout', label: 'Streaks' },
{ icon: 'notebook-pen', label: 'Check-in' }
]
};
}
}
</script>
</body>
</html>
