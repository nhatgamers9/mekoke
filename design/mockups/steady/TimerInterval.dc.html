<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Interval workout</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 0; padding: 12px 20px 40px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center">
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="End workout"></x-import>
<span class="headline">Tabata</span>
<x-import component-from-global-scope="Steady.Chip">3 / 8</x-import>
</div>
<div style="flex-grow: 1"></div>
<x-import component-from-global-scope="Steady.TimerRing" progress="{{progress}}" time="0:14" phase="WORK" caption="20 s work · 10 s rest" numerals="gym" size="{{ringSize}}"></x-import>
<div style="height: 24px"></div>
<x-import component-from-global-scope="Steady.Chip" tone="tide">Next: Rest 0:10</x-import>
<div style="flex-grow: 1"></div>
<div style="align-self: stretch; display: flex; flex-direction: column; gap: 8px">
<x-import component-from-global-scope="Steady.ProgressBar" value="{{overall}}" label="Workout progress"></x-import>
<div style="display: flex; justify-content: space-between">
<span class="caption" style="color: var(--ink-muted)">Round 3 of 8</span>
<span class="caption" style="color: var(--ink-muted); font-variant-numeric: tabular-nums">2:54 left</span>
</div>
</div>
<div style="height: 32px"></div>
<div style="display: flex; align-items: center; gap: 24px">
<x-import component-from-global-scope="Steady.IconButton" variant="filled" icon="rotate-ccw" label="Restart round"></x-import>
<x-import component-from-global-scope="Steady.IconButton" variant="play" icon="pause" label="Pause"></x-import>
<x-import component-from-global-scope="Steady.IconButton" variant="filled" icon="skip-forward" label="Skip round"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { progress: 0.3, overall: 0.275, ringSize: 300 };
}
}
</script>
</body>
</html>
