<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Evening check-in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 32px 20px 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="label" style="color: var(--ink-muted)">Friday, October 2</span>
<h1 class="display" style="margin: 0">Good evening</h1>
</div>
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="settings" label="Settings"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 class="headline" style="margin: 0">How was today?</h2>
<x-import component-from-global-scope="Steady.MoodPicker" value="{{mood}}"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="headline" for="note">One line about today</label>
<textarea id="note" class="body" maxlength="140" rows="3" style="box-sizing: border-box; width: 100%; height: 104px; padding: 12px 16px; border: 2px solid var(--line-strong); border-radius: 14px; background: var(--surface); color: var(--ink); resize: none">Walked after dinner. No cigarettes, even at the bar.</textarea>
<span class="caption" style="align-self: flex-end; color: var(--ink-muted); font-variant-numeric: tabular-nums">52 / 140</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<x-import component-from-global-scope="Steady.Chip" tone="tide" icon="sprout">Day 127 · No smoking</x-import>
</div>
<div style="flex-grow: 1"></div>
<x-import component-from-global-scope="Steady.Button" variant="primary" block="{{yes}}">Save check-in</x-import>
</div>
<x-import component-from-global-scope="Steady.TabBar" items="{{tabs}}" active="{{tab}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
mood: 4,
tab: 3,
tabs: [
{ icon: 'audio-waveform', label: 'Focus' },
{ icon: 'timer', label: 'Timer' },
{ icon: 'sprout', label: 'Streaks' },
{ icon: 'notebook-pen', label: 'Check-in' }
]
};
}
}
</script>
</body>
</html>
