<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Steady · Sign in with email</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/steady/tokens.css">
<link rel="stylesheet" href="ds/steady/components/bundle.css">
<script src="ds/steady/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f2a649}a:hover{color:#f3eee7}
</style>
</helmet>
<div data-theme="dark" style="width: 360px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 12px 20px 28px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="display: flex; justify-content: flex-start">
<x-import component-from-global-scope="Steady.IconButton" variant="plain" icon="x" label="Close"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="display" style="margin: 0">Sign in with email</h1>
<p class="body" style="margin: 0; color: var(--ink-muted)">We’ll email you a link to sign in. No password needed.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="label" for="email">Email</label>
<input id="email" type="email" autocomplete="email" inputmode="email" value="alex@gmail.com" class="body" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border: 2px solid var(--amber); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: var(--focus-ring)">
<p class="caption" style="margin: 0; color: var(--ink-muted)">Use an address you can open on this phone.</p>
</div>
<div style="flex-grow: 1"></div>
<a href="CheckEmail.dc.html" class="body-strong" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 9999px; background: var(--amber); color: var(--on-amber); text-decoration: none">Send sign-in link</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
